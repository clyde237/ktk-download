name: Multi-Platform Build & Packaging

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version semver à publier, sans le préfixe v (ex. 0.2.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tauri:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: write
    outputs:
      release_version: ${{ steps.release.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux (.deb & .AppImage)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact-pattern: 'src-tauri/target/release/bundle/*/*.{deb,AppImage}'
          - name: Windows (.exe & .msi)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact-pattern: 'src-tauri/target/release/bundle/*/*.{exe,msi}'
          - name: macOS (.dmg)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact-pattern: 'src-tauri/target/release/bundle/dmg/*.dmg'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: release
        env:
          TAG_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG_VERSION#v}"
          if [[ -z "$VERSION" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            RELEASE_STATUS="$(curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -o "$RUNNER_TEMP/latest-release.json" \
              -w "%{http_code}" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest")"

            if [[ "$RELEASE_STATUS" == "200" ]]; then
              LATEST_TAG="$(node -e "const release = require(process.argv[1]); process.stdout.write(release.tag_name || '')" "$RUNNER_TEMP/latest-release.json")"
              LATEST_VERSION="${LATEST_TAG#v}"
              VERSION="$(node - "$LATEST_VERSION" <<'NODE'
          const match = process.argv[2].match(/^(\d+)\.(\d+)\.(\d+)$/);
          if (!match) {
            console.error(`Le dernier tag publié n'est pas une version semver stable : ${process.argv[2]}`);
            process.exit(1);
          }
          console.log(`${match[1]}.${match[2]}.${Number(match[3]) + 1}`);
          NODE
          )"
            elif [[ "$RELEASE_STATUS" == "404" ]]; then
              VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
            else
              echo "Impossible de déterminer la dernière release GitHub (HTTP $RELEASE_STATUS)." >&2
              exit 1
            fi
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "La version de release doit respecter le format semver X.Y.Z." >&2
            exit 1
          fi
          node - "$VERSION" <<'NODE'
          const fs = require('node:fs');
          const path = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.version = process.argv[2];
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build frontend
        run: npm run build

      - name: Build and Package with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signature interne Tauri Updater
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Signature de code Windows (Authenticode SignTool)
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # La signature Apple du DMG est désactivée; seule la signature updater est requise.
        with:
          tagName: v${{ steps.release.outputs.version }}
          releaseName: 'ktk-download v${{ steps.release.outputs.version }}'
          releaseBody: 'Consultez les notes de version pour les détails des nouveautés de ktk-download.'
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ktk-download-${{ matrix.platform.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  publish-release:
    name: Publish completed release
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish release after all platform builds succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ needs.build-tauri.outputs.release_version }}
        run: |
          mapfile -t RELEASE_IDS < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id"
          )

          if [[ "${#RELEASE_IDS[@]}" -ne 1 ]]; then
            echo "Attendu une release pour le tag $RELEASE_TAG, trouvé ${#RELEASE_IDS[@]}." >&2
            exit 1
          fi

          RELEASE_ID="${RELEASE_IDS[0]}"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false
