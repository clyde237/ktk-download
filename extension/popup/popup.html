<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ktk-download</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <img src="../icons/icon-32.png" alt="ktk-download" class="brand-icon" />
        <div class="brand-text">
          <h1 class="brand-title">ktk-download</h1>
          <span class="brand-subtitle">Capture de vidéos web</span>
        </div>
      </div>
      <div class="app-status" id="app-status">
        <span class="status-dot status-offline" id="status-dot"></span>
        <span class="status-label" id="status-label">Vérification...</span>
      </div>
    </header>

    <main class="content">
      <div class="action-bar" id="action-bar" style="display: none">
        <span class="counter" id="media-counter">0 vidéo détectée</span>
        <div class="bulk-buttons">
          <button
            id="btn-download-all"
            class="btn btn-secondary btn-sm"
            title="Tout envoyer vers ktk-download"
          >
            Tout télécharger
          </button>
          <button id="btn-clear" class="btn btn-ghost btn-sm" title="Vider la liste actuelle">
            Effacer
          </button>
        </div>
      </div>

      <div id="media-list" class="media-list">
        <!-- Rempli dynamiquement -->
      </div>

      <div id="empty-state" class="empty-state">
        <svg
          class="empty-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <rect x="2" y="4" width="20" height="16" rx="3" />
          <path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none" />
        </svg>
        <h3 class="empty-title">Aucune vidéo détectée</h3>
        <p class="empty-desc">
          Lancez la lecture d'une vidéo sur cette page web pour que ktk-download la capture
          automatiquement.
        </p>
      </div>
    </main>

    <footer class="app-footer">
      <div class="footer-info">
        <span>ktk-download v1.0.0</span>
        <a href="#" id="link-open-app" class="footer-link">Ouvrir l'application</a>
      </div>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
